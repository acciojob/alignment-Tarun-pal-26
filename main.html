<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Assignment 3</title>

    <style>
        table {
            border: 1px solid black;
            spacing: 1px;
            padding: 1px;
        }

        .middle {

        }

        .right {

        }

        .green {

</head>
